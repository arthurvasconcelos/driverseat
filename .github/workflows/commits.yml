name: Commit messages

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-commit-message.sh <<< "${TITLE}"
      # Release pull requests carry commits that were checked when they reached develop.
      - name: Commits
        if: github.event_name == 'push' || github.base_ref != 'main'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: .github/scripts/check-commits.sh "${BASE}" "${HEAD}"
