name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint scripts
        run: shellcheck scripts/*.sh tests/*.sh .github/scripts/*.sh

  test:
    name: Script tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            bash: bash
          - name: macOS bash 3.2
            os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: tests/scripts.test.sh
        env:
          TEST_BASH: ${{ matrix.bash }}

  release-check:
    name: Release PR check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only develop is merged into main
        if: github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests into main must come from this repository's develop branch. Target develop instead."
          exit 1
      - name: Version is bumped and not released yet
        run: |
          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          MAIN_VERSION="$(git show origin/main:.claude-plugin/plugin.json 2> /dev/null | jq -r .version || true)"
          if [[ "${VERSION}" == "${MAIN_VERSION}" ]]; then
              echo "::error::plugin.json version is still ${VERSION}, the same as main. Bump it on develop before releasing."
              exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/pair--v${VERSION}" > /dev/null; then
              echo "::error::pair--v${VERSION} is already released. Bump the version."
              exit 1
          fi
          echo "Releasing ${VERSION} (main is at ${MAIN_VERSION:-nothing yet})."
      - name: Changelog has a dated entry
        run: .github/scripts/changelog-section.sh "$(jq -r .version .claude-plugin/plugin.json)"
